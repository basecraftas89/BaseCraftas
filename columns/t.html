<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト｜Base Craftas コラム</title>
<meta name="description" content="">
<link rel="canonical" href="https://basecraftas.com/columns/t.html">
<link rel="icon" href="../images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.column-page{background:var(--cream)}
.column-hero{padding:9rem 5rem 3.5rem;background:#fff;border-bottom:1px solid var(--border)}
.column-wrap{width:min(100% - 40px,880px);margin:0 auto}
.column-kicker{font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:.18em;color:var(--sage);font-weight:700}
.column-hero h1{margin-top:1rem;font-size:clamp(2rem,4vw,3.6rem);line-height:1.35}
.column-lead{margin-top:1.2rem;color:var(--text-sub);font-size:1.02rem;line-height:2}
.column-meta{margin-top:1rem;color:var(--text-muted);font-size:.82rem}
.column-tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.3rem}
.column-tags span{padding:.3rem .6rem;border-radius:999px;background:var(--mist);color:var(--sage);font-size:.74rem}
.column-hero-image{margin-top:2rem}
.column-hero-image img{width:100%;border-radius:16px;box-shadow:var(--shadow-card)}
.column-body{padding:4rem 0 5rem;background:#fff}
.column-body-inner{font-size:1rem;line-height:2.08;color:var(--text)}
.column-body-inner h2{margin:2.8rem 0 1rem;font-size:1.65rem}
.column-body-inner h3{margin:2rem 0 .8rem;font-size:1.28rem}
.column-body-inner p+p{margin-top:1.1rem}
.column-body-inner mark{background:#fff0a8;padding:.05em .22em;border-radius:.2em}
.column-body-inner blockquote{margin:2rem 0;padding:1.3rem 1.5rem;border-left:4px solid var(--terra);background:var(--cream);color:var(--text-sub)}
.editor-bubble{display:grid;grid-template-columns:92px minmax(0,1fr);gap:1rem;align-items:start;margin:2rem 0}
.editor-bubble.right{grid-template-columns:minmax(0,1fr) 92px}
.editor-bubble.right .bubble-avatar{order:2}
.bubble-avatar{text-align:center}
.character-icon{width:82px;height:82px;object-fit:cover;border-radius:50%;box-shadow:var(--shadow-card)}
.character-nameplate{display:block;width:110px;max-width:110px;margin:.35rem 0 0 50%;transform:translateX(-50%)}
.bubble-copy{padding:1.2rem 1.4rem;border:1px solid var(--border-sage);border-radius:14px;background:var(--cream)}
.column-back{display:inline-block;margin-top:3rem;color:var(--sage);font-weight:700}
@media(max-width:700px){.column-hero{padding:7rem 2rem 3rem}.column-wrap{width:min(100% - 32px,880px)}.editor-bubble,.editor-bubble.right{grid-template-columns:1fr}.editor-bubble.right .bubble-avatar{order:0}}
</style>
</head>
<body class="column-page">
<header class="nav">
  <a href="../index.html" class="nav-logo"><img src="../images/logo-header.png" alt="Base Craftas" class="nav-logo-img"></a>
  <nav class="nav-links" aria-label="メインナビゲーション"><li><a href="../index.html">Home</a></li><li><a href="../services/">Services</a></li><li><a href="../about.html">About</a></li><li><a href="../contact.html">Contact</a></li></nav>
</header>
<main>
  <article>
    <section class="column-hero">
      <div class="column-wrap">
        <p class="column-kicker">COLUMN / 2026-09-06</p>
        <h1>テスト</h1>
        <p class="column-lead"></p>
        <p class="column-meta">Base Craftas 編集部</p>
        <div class="column-tags"></div>
        
      </div>
    </section>
    <section class="column-body">
      <div class="column-wrap column-body-inner">
        テスト<div>テスト</div><div><br></div>
        <a class="column-back" href="index.html">← コラム一覧へ戻る</a>
      </div>
    </section>
  </article>
</main>
</body>
</html>
