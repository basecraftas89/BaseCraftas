[[routes]]
pattern = "basecraftas.com/api/tsuzuri-studio/*"
zone_name = "basecraftas.com"

[[routes]]
pattern = "basecraftas.com/api/column-studio/*"
zone_name = "basecraftas.com"

[[routes]]
pattern = "basecraftas.com/api/totonoe-member/*"
zone_name = "basecraftas.com"

[[routes]]
pattern = "basecraftas.com/column-media/*"
zone_name = "basecraftas.com"

[[routes]]
pattern = "basecraftas.com/public-content/*"
