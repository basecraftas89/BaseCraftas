STRIPE_MODE = "test"
STRIPE_CHECKOUT_ENABLED = "false"
PUBLIC_SITE_ORIGIN = "https://basecraftas.com"
RESEND_FROM_EMAIL = "ToToNoE+ <no-reply@auth.basecraftas.com>"
STRIPE_PRICE_TAYORI_MONTHLY = "price_1UEOPRB9PphUmq5pMnQsXOkP"
STRIPE_PRICE_CURRICULUM_MONTHLY = "price_1UEORtB9PphUmq5pf4E2yrRt"
STRIPE_PRICE_CURRICULUM_ANNUAL = "price_1UEOTbB9PphUmq5pmL2x5sAI"
STRIPE_PRICE_IROHA_FIRST = "price_1UF3w1B9PphUmq5pcta3Psid"
STRIPE_PRICE_IROHA_REJOIN = "price_1UF3tiB9PphUmq5pFSkfEqhg"
TEAM_DOMAIN = "https://royal-bird-2fb2.cloudflareaccess.com"
POLICY_AUD = "bc858ed892e89c942df1e54dd631b77a6bdb6c7f8d8d0aa97462f2b968ae4a03"
GITHUB_REPOSITORY = "basecraftas89/BaseCraftas"
GITHUB_BRANCH = "main"
DRIVE_ARCHIVE_FOLDER_ID = "12YHtKFODi75v_W08xFACzm97DjFIUCjg"
DRIVE_WEEKLY_FOLDER_ID = "18Ahx_o5GwHH_BjyLK1e4NItNBKoWc8uy"
DRIVE_WEEKLY_RESPONSE_FOLDER_ID = "1QLSGk2uVnlM7Fu01pnM9yAjs7-J2XUC1"
