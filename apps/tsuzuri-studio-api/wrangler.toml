name = "column-studio-api"
main = "src/worker.js"
compatibility_date = "2026-09-11"
workers_dev = false
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[triggers]
crons = [ "0 * * * *", "0 0 * * SAT" ]

[vars]
