name = "basecraftas"
main = "published-runtime/worker.js"
compatibility_date = "2026-09-11"
workers_dev = false
preview_urls = false

# Always rebuild the complete public asset manifest before a direct Wrangler
# deployment. Character stories are generated from Studio JSON during this
# step, so deploying a stale dist directory would otherwise remove their URLs.
[build]
command = "node scripts/public-release-guard.mjs --source && npm run build"
cwd = "."

[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = true

[[services]]
binding = "MEMBER_API"
service = "column-studio-api"

[[services]]
binding = "MEMBER_UI_ASSETS"
service = "totonoe-member-ui"

[[services]]
binding = "PUBLIC_UI_ASSETS"
service = "totonoe-public-ui"

# Existing binary media imports from the confirmed runtime.
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = true
