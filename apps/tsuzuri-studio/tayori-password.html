<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TAYORIパスワード設定｜ToToNoE+ Studio</title>
  <link rel="stylesheet" href="/projects/totonoe/TAYORI/weekly-member.css?v=20260912-login">
</head>
<body class="member-login-page">
  <main class="member-login-card">
    <a class="member-login-brand" href="/apps/totonoe-studio/" aria-label="ToToNoE+ Studioへ戻る"><img src="/projects/totonoe/assets/totonoe-logo-optimized.webp" alt="ToToNoE+"></a>
    <p class="eyebrow">TAYORI ACCOUNT</p>
    <h1>パスワード設定</h1>
    <p class="member-login-intro">Studioに登録された運営メンバーのアカウントで、TAYORIのパスワードを設定できます。</p>
    <p id="tayoriStaffIdentity" class="member-login-help" aria-live="polite">運営メンバーの認証を確認しています…</p>
    <form id="tayoriStaffPasswordForm" class="member-login-form" hidden>
      <label for="tayoriStaffPassword">新しいパスワード</label>
      <input id="tayoriStaffPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required placeholder="12文字以上">
      <label for="tayoriStaffPasswordConfirm">新しいパスワード（確認）</label>
      <input id="tayoriStaffPasswordConfirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required placeholder="もう一度入力">
      <button class="primary-button" type="submit">設定してTAYORIを開く</button>
    </form>
    <p class="member-login-status" id="tayoriStaffPasswordStatus" role="alert" aria-live="polite"></p>
    <a class="member-login-return" href="/apps/totonoe-studio/">Studioの管理画面へ戻る</a><br>
    <a class="member-login-return" href="/projects/totonoe/TAYORI/login">通常のログインへ戻る</a>
  </main>
  <script src="tayori-password.js?v=20260927a"></script>
</body>
</html>
