name = "totonoe-public-ui"
main = "worker.js"
compatibility_date = "2026-09-11"
workers_dev = false
preview_urls = false
[build]
command = "node apps/totonoe-public-ui/build-assets.mjs"
cwd = "."
[assets]
directory = "../../dist-totonoe-public-ui"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
